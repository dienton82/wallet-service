
name: Wallet Service CI

# Ejecutamos las validaciones al subir cambios a la rama principal
# o al crear una solicitud de integración.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validación del servicio Go
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Verificar versión de Go
        run: go version

      - name: Validar formato del código
        run: |
          files=$(gofmt -l .)

          if [ -n "$files" ]; then
            echo "Archivos pendientes de formatear:"
            echo "$files"
            exit 1
          fi

      - name: Ejecutar análisis estático
        run: go vet ./...

      - name: Compilar el proyecto
        run: go build ./...

      - name: Ejecutar pruebas unitarias
        run: go test -v -count=1 ./...

      - name: Validar condiciones de carrera
        run: go test -race -count=1 ./...

      - name: Generar cobertura global
        run: |
          go test -coverpkg=./... -coverprofile=coverage.out -count=1 ./...
          go tool cover -func=coverage.out
          go tool cover -html=coverage.out -o coverage.html

      - name: Verificar cobertura del 100%
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')

          echo "Cobertura global: $coverage"

          if [ "$coverage" != "100.0%" ]; then
            echo "No se alcanzó la cobertura esperada."
            exit 1
          fi

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 30

  docker:
    name: Validación del contenedor Docker
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t wallet-service:1.0.0 .

      - name: Verificar imagen generada
        run: docker images wallet-service

      - name: Iniciar contenedor
        run: |
          docker run -d \
            --name wallet-service \
            -p 8080:8080 \
            wallet-service:1.0.0

      - name: Esperar inicio del servicio
        run: |
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8080/accounts/health-check; then
              echo "Servicio disponible."
              exit 0
            fi

            sleep 1
          done

          echo "El servicio no respondió."
          exit 1

      - name: Validar endpoints e idempotencia
        run: |
          BASE_URL="http://localhost:8080"

          # Creamos la cuenta de origen.
          ana=$(curl -fsS -X POST "$BASE_URL/accounts" \
            -H "Content-Type: application/json" \
            -d '{"owner":"Ana","initial_balance":10000}')

          ana_id=$(echo "$ana" | jq -er '.id')

          # Creamos la cuenta de destino.
          juan=$(curl -fsS -X POST "$BASE_URL/accounts" \
            -H "Content-Type: application/json" \
            -d '{"owner":"Juan","initial_balance":5000}')

          juan_id=$(echo "$juan" | jq -er '.id')

          # Consultamos la cuenta de origen.
          curl -fsS "$BASE_URL/accounts/$ana_id" |
            jq -e '.balance == 10000'

          # Construimos los datos de la transferencia.
          payload=$(jq -n \
            --arg from "$ana_id" \
            --arg to "$juan_id" \
            '{from_account_id:$from,to_account_id:$to,amount:2500}')

          # Realizamos la transferencia.
          transfer=$(curl -fsS -X POST "$BASE_URL/transfers" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: transfer-ci-001" \
            -d "$payload")

          transfer_id=$(echo "$transfer" | jq -er '.id')

          echo "$transfer" | jq -e '.amount == 2500'

          # Repetimos la solicitud para validar la idempotencia.
          repeated=$(curl -fsS -X POST "$BASE_URL/transfers" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: transfer-ci-001" \
            -d "$payload")

          echo "$repeated" |
            jq -e --arg id "$transfer_id" '.id == $id'

          # Verificamos los saldos después de la transferencia.
          curl -fsS "$BASE_URL/accounts/$ana_id" |
            jq -e '.balance == 7500'

          curl -fsS "$BASE_URL/accounts/$juan_id" |
            jq -e '.balance == 7500'

          # Consultamos el historial de ambas cuentas.
          curl -fsS "$BASE_URL/accounts/$ana_id/transfers" |
            jq -e --arg id "$transfer_id" \
            'length == 1 and .[0].id == $id'

          curl -fsS "$BASE_URL/accounts/$juan_id/transfers" |
            jq -e --arg id "$transfer_id" \
            'length == 1 and .[0].id == $id'

          echo "Endpoints e idempotencia validados correctamente."

      - name: Validar apagado ordenado
        run: |
          docker stop -t 15 wallet-service

          docker logs wallet-service 2>&1 |
            grep -F "servidor detenido correctamente"

          exit_code=$(docker inspect \
            --format='{{.State.ExitCode}}' wallet-service)

          test "$exit_code" = "0"

      - name: Consultar logs del contenedor
        if: always()
        run: docker logs wallet-service || true

      - name: Eliminar contenedor
        if: always()
        run: docker rm -f wallet-service || true
